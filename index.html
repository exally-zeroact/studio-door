<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>考察部屋 操作卓</title>
<meta name="apple-mobile-web-app-title" content="考察部屋">
<meta name="theme-color" content="#0d0f16">
<style>
  html,body{margin:0;height:100%;background:#0d0f16;color:#e8eaf0;
            font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",system-ui,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:18px;padding:24px;text-align:center;box-sizing:border-box}
  .t{font-size:17px;font-weight:700}
  .s{font-size:14px;color:#98a0b3;line-height:1.7}
  .spin{width:26px;height:26px;border:3px solid #2a2f3d;border-top-color:#f2c14e;
        border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  a.btn{display:inline-block;margin-top:6px;padding:14px 22px;background:#f2c14e;color:#0d0f16;
        border-radius:12px;text-decoration:none;font-weight:800;font-size:16px}
  .err{color:#ff8f8f;font-size:14px;line-height:1.8}
  code{background:#1a1f2b;padding:2px 6px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
<div class="wrap" id="w">
  <div class="spin"></div>
  <div class="t">操作卓につないでいます…</div>
  <div class="s">今のPCの住所を調べています</div>
</div>
<script>
// 変わらない入口。今のトンネルの住所は url.txt にPC側が書き込む。
// 合言葉はこのページのURLの「#」以降から取る（#はサーバに送られないので、公開リポジトリに残らない）。
var OWNER = "exally-zeroact", REPO = "studio-door";
var W = document.getElementById("w");

function show(html){ W.innerHTML = html; }

function fail(msg, detail){
  show('<div class="t">つながりませんでした</div>'
     + '<div class="err">' + msg + '</div>'
     + (detail ? '<div class="s">' + detail + '</div>' : '')
     + '<a class="btn" href="javascript:location.reload()">もう一回ためす</a>');
}

function go(base){
  base = (base || "").trim().replace(/\/+$/, "");
  if (!/^https?:\/\//.test(base)) { return fail("住所が読めませんでした。", "url.txt の中身: <code>" + base + "</code>"); }
  var k = (location.hash || "").replace(/^#/, "");
  var dest = base + "/" + (k ? "?k=" + encodeURIComponent(k) : "");
  show('<div class="spin"></div><div class="t">開いています…</div>'
     + '<div class="s">切り替わらない時は下を押してください</div>'
     + '<a class="btn" href="' + dest + '">操作卓をひらく</a>');
  location.replace(dest);
}

// キャッシュに古い住所を掴まされないよう、APIを先に叩く（毎回できたてを返す）。
var bust = "_=" + Date.now();
fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/url.txt?ref=main&" + bust,
      { headers: { "Accept": "application/vnd.github.raw" }, cache: "no-store" })
  .then(function(r){ if(!r.ok) throw new Error("api " + r.status); return r.text(); })
  .catch(function(){
    return fetch("https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/main/url.txt?" + bust,
                 { cache: "no-store" }).then(function(r){
      if(!r.ok) throw new Error("raw " + r.status); return r.text(); });
  })
  .then(go)
  .catch(function(e){
    fail("PCの住所を取ってこられませんでした。",
         "PCの電源が入っているか、ネットに繋がっているか確認してください。（" + e.message + "）");
  });
</script>
</body>
</html>
