<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>考察部屋 操作卓</title>
<meta name="apple-mobile-web-app-title" content="考察部屋">
<meta name="theme-color" content="#0d0f16">
<style>
  html,body{margin:0;height:100%;background:#0d0f16;color:#e8eaf0;
            font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",system-ui,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:18px;padding:24px;text-align:center;box-sizing:border-box}
  .t{font-size:17px;font-weight:700}
  .s{font-size:14px;color:#98a0b3;line-height:1.7}
  .spin{width:26px;height:26px;border:3px solid #2a2f3d;border-top-color:#f2c14e;
        border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  a.btn{display:inline-block;margin-top:6px;padding:14px 22px;background:#f2c14e;color:#0d0f16;
        border-radius:12px;text-decoration:none;font-weight:800;font-size:16px}
</style>
</head>
<body>
<div class="wrap" id="w">
  <div class="spin"></div>
  <div class="t">開いています…</div>
  <div class="s">切り替わらない時は下を押してください</div>
  <a class="btn" id="go" href="https://ai-radio-door.vercel.app/">操作卓をひらく</a>
</div>
<script>
// ★2026-09-04 作り替え★
//   前は「使い捨てトンネルの住所(url.txt)」へ飛ばしていた。飛んだ先が端末に残るので、
//   PCが再起動するたびアイコンが死んだ(3回やった)。
//   今は ★変わらない入口(中継)★ へ飛ばすだけ。使い捨ての住所はもう誰にも見せない。
var DOOR = "https://ai-radio-door.vercel.app/";
var k = (location.hash || "").replace(/^#/, "");
var dest = DOOR + (k ? "?k=" + encodeURIComponent(k) : "");
document.getElementById("go").href = dest;
location.replace(dest);
</script>
</body>
</html>
